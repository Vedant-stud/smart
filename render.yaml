services:
  - type: web
    name: smart-crop-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smart-crop-db
          property: connectionString
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: smart-crop-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: smart-crop-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: smart-crop-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: smart-crop-db
    databaseName: smart_crop_advisor
    user: smart_crop_advisor
    plan: free
